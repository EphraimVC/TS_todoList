<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css">
    <title>Ts TodoList</title>
  </head>
  <body>
    <div id="app">
      <div class="auth-form">
        <h2>Log In</h2>
        <input type="email" id="emailInput" placeholder="Email" />
        <input type="password" id="passwordInput" placeholder="Password" />
        <button id="loginBtn">Log In</button>
        <p id="errorMessage" style="color: red;"></p>
      </div>
      
      <div class="task-form hide" >
        <input id="taskInput" type="text" placeholder="What needs to be done?" />
        <button id="createTaskBtn">Create New Task</button>
   
        <section >
        <ul class="taskListContainer"></ul>
        </section>
   
      </div>
  
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script type="module" src="/src/supabaseAuth.ts"> </script>
  </body>
</html>
